name: Build Windows exe

# Builds KeystoneDashboard.exe on a Windows machine at GitHub.
# Run it by hand: Actions tab, "Build Windows exe", "Run workflow".
# When a tag like v0.1 is pushed (or a release is published from a new tag),
# it also attaches the exe to the GitHub Release.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: python -m pip install -r requirements-dashboard.txt
      - name: Build the exe
        run: python -m PyInstaller --onefile --windowed --name KeystoneDashboard dashboard.py
      - uses: actions/upload-artifact@v4
        with:
          name: KeystoneDashboard
          path: dist/KeystoneDashboard.exe
      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/KeystoneDashboard.exe --clobber
          else
            gh release create "$TAG" dist/KeystoneDashboard.exe --title "$TAG" --notes "Keystone Dashboard for Windows."
          fi
